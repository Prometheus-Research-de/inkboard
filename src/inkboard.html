<title>Inkboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed infinite canvas; chrome floats at the edges: board chip top-left, view controls top-right, tool dock bottom-centre within reach of pen and thumb.
   Board paper and ink colours are set from script (the user picks the paper); the tokens below are the chrome's. */
:root {
  --board: #ffffff; --grid: #e3e8e6;
  --chrome: #ffffff; --chrome-2: #eef3f1; --line: #d6dedb;
  --fg: #1b2125; --muted: #5c6966;
  --accent: #0b6a85; --accent-tint: #dff0f5;
  --ok: #2c8a57; --warn: #b8730c; --bad: #c3362c;
  --shadow: 0 1px 2px rgb(16 28 26 / .08), 0 10px 28px rgb(16 28 26 / .12);
  --scrim: rgb(16 28 26 / .18);
  --c-ink: #1b2125; --c-blue: #1f54d2; --c-red: #d1352b; --c-green: #1b8649; --c-orange: #df720c; --c-violet: #7438cc;
  --c-yellow: #ffd60a; --c-lime: #86e07d; --c-pink: #ff80cc; --c-sky: #70c6ff; --c-peach: #ffb060;
  --font-ui: "Schibsted Grotesk", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --font-hand: "Kalam", "Segoe Print", "Comic Sans MS", cursive;
  --r-chrome: 14px; --r-btn: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --chrome: #212b29; --chrome-2: #2a3532; --line: #35423f;
    --fg: #e7edeb; --muted: #9aa8a4;
    --accent: #5ec5df; --accent-tint: #1b3940;
    --ok: #5ccb8c; --warn: #f0b04a; --bad: #ff7d72;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 12px 32px rgb(0 0 0 / .42);
    --scrim: rgb(0 0 0 / .42);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --chrome: #212b29; --chrome-2: #2a3532; --line: #35423f;
  --fg: #e7edeb; --muted: #9aa8a4;
  --accent: #5ec5df; --accent-tint: #1b3940;
  --ok: #5ccb8c; --warn: #f0b04a; --bad: #ff7d72;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 12px 32px rgb(0 0 0 / .42);
  --scrim: rgb(0 0 0 / .42);
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--board); color: var(--fg);
  font: 14px/1.4 var(--font-ui);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  touch-action: none; overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
}
canvas { position: fixed; inset: 0; display: block; touch-action: none; }
#live { pointer-events: none; }
button { font: inherit; color: inherit; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.chrome { background: var(--chrome); border: 1px solid var(--line); border-radius: var(--r-chrome); box-shadow: var(--shadow); }
.ib {
  width: 40px; height: 40px; padding: 0; flex: none; position: relative;
  display: inline-grid; place-items: center; cursor: pointer;
  border: 0; border-radius: var(--r-btn); background: transparent; color: var(--fg);
}
.ib:hover { background: var(--chrome-2); }
.ib[aria-pressed="true"] { background: var(--accent-tint); color: var(--accent); }
.ib:disabled { opacity: .32; cursor: default; background: transparent; }
.ib.caret::after {
  content: ""; position: absolute; right: 5px; bottom: 5px;
  border: 3.5px solid transparent; border-right-color: currentColor; border-bottom-color: currentColor; opacity: .55;
}

/* top bar */
.topbar {
  position: fixed; z-index: 10; pointer-events: none;
  top: calc(10px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 8px;
}
.topbar > * { pointer-events: auto; }
.boardchip {
  display: flex; align-items: center; height: 44px; min-width: 0; max-width: min(440px, 100%);
  padding: 0 14px 0 2px; cursor: pointer; text-align: left;
}
.boardchip:hover { background: var(--chrome-2); }
.boardchip .ico { width: 40px; height: 40px; display: grid; place-items: center; flex: none; }
#boardTitle { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.save { display: inline-flex; align-items: center; gap: 6px; margin-left: 10px; color: var(--muted); font-size: 12.5px; white-space: nowrap; flex: none; }
.save::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.save[data-state="saved"]::before { background: var(--ok); }
.save[data-state="pending"]::before, .save[data-state="syncing"]::before, .save[data-state="loading"]::before { background: var(--warn); }
.save[data-state="error"]::before { background: var(--bad); }
.viewbar { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 1px; }
.zoomlbl {
  min-width: 60px; height: 40px; padding: 0 6px; border: 0; border-radius: var(--r-btn); background: transparent;
  font-weight: 500; font-variant-numeric: tabular-nums; cursor: pointer;
}
.zoomlbl:hover { background: var(--chrome-2); }
.pbtn {
  height: 40px; padding: 0 12px 0 9px; border: 0; border-radius: var(--r-btn); background: transparent; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; font-weight: 500; color: var(--fg);
}
.pbtn:hover, .pbtn[aria-expanded="true"] { background: var(--chrome-2); }
.pchip { width: 22px; height: 22px; border-radius: 6px; background: var(--board); box-shadow: inset 0 0 0 1.5px var(--fg); flex: none; }
@media (max-width: 560px) { .pbtn { padding: 0 9px; } }
.vsep { width: 1px; height: 24px; background: var(--line); margin: 0 3px; }

/* dock */
.dock {
  position: fixed; z-index: 10; left: 50%; transform: translateX(-50%);
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  width: max-content; max-width: calc(100vw - 2 * max(16px, env(safe-area-inset-left, 0px)));
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 2px 4px; padding: 3px;
}
.group { display: flex; align-items: center; gap: 2px; }
.sep { width: 1px; height: 28px; background: var(--line); margin: 0 3px; }
.swatch {
  width: 32px; height: 40px; padding: 0; border: 0; background: transparent; cursor: pointer;
  display: grid; place-items: center; border-radius: var(--r-btn);
}
.swatch::before {
  content: ""; width: 20px; height: 20px; border-radius: 50%;
  background: var(--sw); box-shadow: inset 0 0 0 1px var(--line);
}
.swatch:hover::before { transform: scale(1.1); }
.swatch[aria-pressed="true"]::before { box-shadow: 0 0 0 2px var(--chrome), 0 0 0 4px var(--fg); }
.size {
  width: 32px; height: 40px; padding: 0; border: 0; background: transparent; cursor: pointer;
  display: grid; place-items: center; border-radius: var(--r-btn); color: var(--fg);
}
.size:hover { background: var(--chrome-2); }
.size i { display: block; width: var(--d); height: var(--d); border-radius: 50%; background: currentColor; }
.size[aria-pressed="true"] { background: var(--accent-tint); color: var(--accent); }

/* selection bar */
#selbar { position: fixed; left: 0; top: 0; z-index: 9; display: flex; gap: 2px; padding: 3px; }
#selbar button {
  height: 36px; padding: 0 12px 0 8px; border: 0; border-radius: 9px; background: transparent; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; font-weight: 500;
}
#selbar button:hover { background: var(--chrome-2); }
#selbar svg.i { width: 18px; height: 18px; }
#selbar .danger { color: var(--bad); }

/* popovers */
.pop { position: fixed; z-index: 20; }
#shapePop { display: flex; gap: 2px; padding: 3px; }
#paperPop { padding: 12px 12px 10px; display: grid; gap: 6px; width: 252px; }
#paperPop h3, #helpPop h3, .dsec h3 {
  font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0;
}
.papers { display: flex; gap: 6px; margin-bottom: 6px; }
.paper {
  width: 38px; height: 38px; border-radius: 10px; cursor: pointer; padding: 0;
  background: var(--pp); border: 1px solid var(--line);
}
.paper[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--chrome), 0 0 0 4px var(--accent); }
.patterns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.pat {
  height: 34px; border: 1px solid var(--line); border-radius: 8px; background: transparent; cursor: pointer;
  font-size: 12.5px; font-weight: 500;
}
.pat:hover { background: var(--chrome-2); }
.pat[aria-pressed="true"] { background: var(--accent-tint); color: var(--accent); border-color: transparent; }
#helpPop {
  top: calc(64px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  width: min(380px, calc(100vw - 32px)); max-height: calc(100% - 160px); overflow: auto;
  padding: 16px 18px 18px; touch-action: pan-y; -webkit-user-select: text; user-select: text;
}
#helpPop h2 { font: 700 26px/1.1 var(--font-hand); margin: 0 0 6px; }
#helpPop h3 { margin: 18px 0 6px; }
#helpPop p, #helpPop li { margin: 0; line-height: 1.5; }
#helpPop ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; }
.pendia { display: block; width: 100%; height: auto; color: var(--fg); margin: 6px 0 4px; }
.pendia .lbl { font: 500 11.5px var(--font-ui); fill: currentColor; }
.pendia .cap { fill: var(--accent); stroke: none; }
.penstat { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 9px; background: var(--chrome-2); font-size: 13px; }
.penstat b { font-weight: 600; }
.meter { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; min-width: 40px; }
.meter i { display: block; height: 100%; width: 0; background: var(--accent); }
.keys { display: grid; grid-template-columns: max-content 1fr; gap: 5px 12px; margin: 0; }
.keys kbd {
  font: 500 12px var(--font-ui); padding: 1px 6px; border-radius: 5px;
  border: 1px solid var(--line); background: var(--chrome-2); white-space: nowrap;
}
.keys dd { margin: 0; color: var(--muted); }

/* drawer */
#scrim { position: fixed; inset: 0; z-index: 25; background: var(--scrim); }
#drawer {
  position: fixed; z-index: 30; top: 0; bottom: 0; left: 0; width: min(360px, 88vw);
  background: var(--chrome); border-right: 1px solid var(--line); box-shadow: var(--shadow);
  display: flex; flex-direction: column;
  padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: env(safe-area-inset-left, 0px);
}
.dhead { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 18px; }
.dhead h2 { font: 700 28px/1.1 var(--font-hand); margin: 0; }
.newb {
  margin: 10px 16px 6px; height: 44px; border-radius: var(--r-btn); border: 1px solid var(--line);
  background: var(--chrome-2); font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.newb:hover { border-color: var(--accent); color: var(--accent); }
#boardList { list-style: none; margin: 0; padding: 4px 8px; overflow: auto; flex: 1; min-height: 80px; touch-action: pan-y; }
.bitem { display: flex; align-items: center; gap: 2px; padding: 2px; border-radius: 11px; }
.bitem.current { background: var(--accent-tint); }
.bopen {
  flex: 1; min-width: 0; display: grid; gap: 1px; padding: 7px 10px; text-align: left;
  border: 0; border-radius: 9px; background: transparent; cursor: pointer;
}
.bopen:hover { background: var(--chrome-2); }
.bitem.current .bopen:hover { background: transparent; }
.bname { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bmeta { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.bitem .ib { width: 36px; height: 36px; }
.bitem .ib svg.i { width: 18px; height: 18px; }
.bitem .ib.confirm { width: auto; padding: 0 10px; color: var(--bad); font-weight: 600; font-size: 13px; }
.rename {
  font: 600 14px var(--font-ui); width: 100%; padding: 6px 8px; border-radius: 7px;
  border: 1px solid var(--accent); background: var(--chrome-2); color: var(--fg); -webkit-user-select: text; user-select: text;
}
.dsec { border-top: 1px solid var(--line); margin-top: 6px; padding: 12px 8px 0; display: grid; gap: 1px; overflow: auto; }
.dsec h3 { margin: 0 10px 4px; }
.row {
  display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; padding: 0 10px;
  border: 0; border-radius: 9px; background: transparent; cursor: pointer; text-align: left;
}
.row:hover { background: var(--chrome-2); }
.row svg.i { width: 19px; height: 19px; color: var(--muted); }
.note { color: var(--muted); font-size: 12.5px; line-height: 1.45; margin: 10px 18px 0; }

/* text editor + toast */
#textEdit {
  position: fixed; left: 0; top: 0; z-index: 5; margin: 0; padding: 0; border: 0; border-radius: 0;
  outline: 1.5px dashed var(--accent); outline-offset: 5px; background: transparent; transform-origin: 0 0;
  font-family: var(--font-hand); line-height: 1.3; resize: none; overflow: hidden; white-space: pre;
  -webkit-user-select: text; user-select: text; touch-action: auto; caret-color: var(--accent);
}
#toast {
  position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); bottom: 80px;
  max-width: calc(100vw - 32px); padding: 9px 14px; border-radius: 10px;
  background: var(--fg); color: var(--chrome); font-weight: 500; box-shadow: var(--shadow);
}
#importFile { position: fixed; left: -9999px; width: 1px; height: 1px; opacity: 0; }

@media (max-width: 560px) {
  .save span { display: none; }
  .hide-narrow { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<canvas id="board"></canvas>
<canvas id="live" aria-hidden="true"></canvas>
<textarea id="textEdit" hidden spellcheck="false" wrap="off"></textarea>

<div class="topbar">

    <button class="ib hide-narrow" id="fsBtn" data-icon="fullscreen" data-ta="fullscreen"></button>
    <button class="ib" id="helpBtn" data-icon="help" aria-pressed="false" data-ta="help"></button>
  </div>
</div>

<div class="chrome dock" id="dock" role="toolbar" data-ta="toolsBar">
  <div class="group">
    <button class="ib" data-tool="pen" data-icon="pen"></button>
    <button class="ib" data-tool="hl" data-icon="marker"></button>
    <button class="ib" data-tool="eraser" data-icon="eraser"></button>
    <button class="ib" data-tool="select" data-icon="lasso"></button>
    <button class="ib caret" data-tool="shape" id="shapeBtn" aria-haspopup="true"></button>
    <button class="ib" data-tool="text" data-icon="text"></button>

  <div class="sep" aria-hidden="true"></div>
  <div class="group" id="swatches"></div>
  <div class="group" id="sizes"></div>
  <div class="sep" aria-hidden="true"></div>

    <button class="ib" id="redoBtn" data-icon="redo" data-ta="redo" disabled></button>
  </div>
</div>

<div class="chrome" id="selbar" hidden>
  <button id="dupBtn"><span data-icon="copy"></span><span data-t="duplicate"></span></button>
  <button id="delBtn" class="danger"><span data-icon="trash"></span><span data-t="delete"></span></button>
</div>

<div class="chrome pop" id="shapePop" role="menu" hidden>
  <button class="ib" data-shape="line" data-icon="line" role="menuitem"></button>
  <button class="ib" data-shape="arrow" data-icon="arrow" role="menuitem"></button>
  <button class="ib" data-shape="rect" data-icon="rect" role="menuitem"></button>
  <button class="ib" data-shape="ellipse" data-icon="ellipse" role="menuitem"></button>
</div>

<div class="chrome pop" id="paperPop" hidden>
  <h3 data-t="paperColor"></h3>
  <div class="papers" id="papers"></div>
  <h3 data-t="paperPattern"></h3>
  <div class="patterns" id="patterns"></div>
</div>

<div class="chrome pop" id="helpPop" hidden></div>

<div id="scrim" hidden></div>
<aside id="drawer" hidden>
  <div class="dhead">
    <h2>Inkboard</h2>
    <button class="ib" id="closeDrawer" data-icon="close" data-ta="close"></button>
  </div>
  <button class="newb" id="newBoardBtn"><span data-icon="plus"></span><span data-t="newBoard"></span></button>
  <ul id="boardList"></ul>
  <div class="dsec">
    <h3 data-t="currentBoard"></h3>
    <button class="row" id="paperRow"><span data-icon="paper"></span><span data-t="background"></span></button>
    <button class="row" id="pdfBtn"><span data-icon="download"></span><span data-t="savePdf"></span></button>
    <button class="row" id="pngBtn"><span data-icon="download"></span><span data-t="savePng"></span></button>
    <button class="row" id="copyBtn"><span data-icon="copy"></span><span data-t="copyImage"></span></button>
    <button class="row" id="jsonBtn"><span data-icon="download"></span><span data-t="saveJson"></span></button>
    <button class="row" id="importBtn"><span data-icon="upload"></span><span data-t="importJson"></span></button>
  </div>
  <p class="note" id="storageNote"></p>
</aside>
<input type="file" id="importFile" accept=".json,application/json" tabindex="-1" aria-hidden="true">
<div id="toast" role="status" hidden></div>

  syncing = true; lastSync = Date.now();
  try {
    if (!dirty) setSave('syncing');
    const snap = await db.doc(P.idx()).get();
    const r = snap.exists ? (snap.data() || {}) : {};
    const del = new Set([...(Array.isArray(r.deleted) ? r.deleted : []), ...deleted]);
    deleted = [...del].slice(-300);
    const map = new Map();
    for (const b of boards) if (!b.pristine && !del.has(b.id)) map.set(b.id, b);
    for (const rb of (Array.isArray(r.boards) ? r.boards : [])) {
      if (!rb || typeof rb.id !== 'string' || del.has(rb.id)) continue;
      const lb = map.get(rb.id);
      if (!lb) { map.set(rb.id, remoteEntry(rb)); continue; }
      lb.chunks = rb.chunks || 0;
      if ((rb.updated || 0) > (lb.updated || 0)) { lb.name = String(rb.name || lb.name); lb.updated = rb.updated; lb.n = rb.n || 0; lb.where = 'remote'; }
      else lb.where = rb.updated === lb.updated ? 'both' : 'local';
    }
    for (const id of del) lsDel(LS_BOARD(id));
    const welcome = board && board.pristine ? board : null;
    boards = [...map.values()];
    if (welcome && !boards.length) boards.push(welcome);
    if (board && (del.has(board.id) || (welcome && boards.length && !boards.includes(welcome)))) board = null;
    if (!board) {
      if (boards.length) await openBoard(mostRecent().id);
    } else if (board.where === 'remote' && !dirty && !action && !textEditing) {
      setBoard(board, await fetchRemote(board), true);
    }
    let needIndex = del.size !== (Array.isArray(r.deleted) ? r.deleted.length : 0);
    for (const b of boards) {
      if (b.where !== 'local' || b === board || b.pristine) continue;
      const list = readLocal(b.id);
      if (list) { await remote(() => pushBoard(b, chunks(serial(sanitize(list))))); needIndex = true; }
    }
    if (board && !board.pristine && board.where === 'local') await saveNow();
    else if (needIndex) await remote(() => pushIndex());
    writeLocalIndex();
    updateBoardUI();
    if (!dirty) setSave('saved');
  } catch (err) {
    console.warn('Sync', err);
    if (!dirty) setSave('local');
  } finally { syncing = false; }
}

function renderCanvas(maxSide) {

  const pad = 40, x0 = b[0] - pad, y0 = b[1] - pad, w = b[2] - b[0] + pad * 2, h = b[3] - b[1] + pad * 2;

  c.width = Math.ceil(w * s); c.height = Math.ceil(h * s);

}
function renderPNG() {

// Minimal one-page PDF: the board as a JPEG, page sized to the board (long side = A4 long side).
async function buildPDF() {
  const c = renderCanvas(6000);
  if (!c) return null;
  const jb = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.92));
  const jpg = new Uint8Array(await jb.arrayBuffer());
  const k = 841.89 / Math.max(c.width, c.height), pw = (c.width * k).toFixed(2), ph = (c.height * k).toFixed(2);
  const enc = new TextEncoder(), parts = [], off = [];
  let len = 0;
  const push = x => { const b = typeof x === 'string' ? enc.encode(x) : x; parts.push(b); len += b.length; };
  const obj = (n, s) => { off[n] = len; push(`${n} 0 obj\n${s}`); };
  push('%PDF-1.4\n');
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
  obj(3, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n`);
  obj(4, `<< /Type /XObject /Subtype /Image /Width ${c.width} /Height ${c.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);
  push(jpg); push('\nendstream\nendobj\n');
  const content = `q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
  obj(5, `<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
  const xref = len;
  let tail = 'xref\n0 6\n0000000000 65535 f \n';
  for (let i = 1; i <= 5; i++) tail += String(off[i]).padStart(10, '0') + ' 00000 n \n';
  push(tail + `trailer\n<< /Size 6 /Root 1 0 R /Info << /Producer (Inkboard) >> >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts, { type: 'application/pdf' });
}
async function offerFile(name, data) {

  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

ta.addEventListener('blur', finishText);
ta.addEventListener('input', placeText);
ta.addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key === 'Escape' || (e.key === 'Enter' && (e.ctrlKey || e.metaKey))) { e.preventDefault(); ta.blur(); }
});

window.addEventListener('keydown', e => {
  if (e.target && e.target.closest && e.target.closest('input, textarea')) return;
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (e.code === 'Space') { if (!spaceDown) { spaceDown = true; updateCursor(); } e.preventDefault(); return; }
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }
  if (mod && k === 'a') { e.preventDefault(); selectAll(); return; }
  if (mod && k === 'd') { e.preventDefault(); duplicateSel(); return; }
  if (mod && k === '0') { e.preventDefault(); zoomAt(W / 2, H / 2, 1 / view.z); return; }
  if (mod && (k === '+' || k === '=')) { e.preventDefault(); zoomAt(W / 2, H / 2, 1.25); return; }
  if (mod && k === '-') { e.preventDefault(); zoomAt(W / 2, H / 2, 0.8); return; }
  if (mod || e.altKey) return;
  if (k === 'delete' || k === 'backspace') { if (selection.size) { e.preventDefault(); deleteSel(); } return; }
  if (k === 'escape') { closePopovers(); if (drawerOpen()) closeDrawer(); else clearSelection(); return; }
  if ((k === '[' || k === ']') && selection.size) { rotateSel((k === ']' ? 1 : -1) * Math.PI / 12); return; }
  const tools = { p: 'pen', b: 'pen', m: 'hl', h: 'hl', e: 'eraser', v: 'select', s: 'select', t: 'text' };
  const shapes = { l: 'line', a: 'arrow', r: 'rect', o: 'ellipse' };
  if (tools[k]) { setTool(tools[k]); return; }
  if (shapes[k]) { prefs.shape = shapes[k]; setTool('shape'); return; }
  if (k === 'f') { fitView(); return; }
  if (['1', '2', '3'].includes(k) && prefs.tool !== 'select') { prefs.size[prefs.tool] = +k - 1; savePrefs(); updateDock(); }
});
window.addEventListener('keyup', e => { if (e.code === 'Space') { spaceDown = false; updateCursor(); } });
window.addEventListener('resize', resize);
window.addEventListener('blur', () => { spaceDown = false; updateCursor(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (dirty) saveNow(); saveView(); }
  else if (db && !dirty && !action && Date.now() - lastSync > 5000) syncRemote();
});
window.addEventListener('pagehide', () => { if (dirty) saveNow(); });
if (document.fonts && document.fonts.load) {
  document.fonts.load(`24px ${TEXT_FONT}`).then(() => {
    for (const el of els) if (el.t === 'text') { delete el._m; delete el._bb; delete el._poly; }
    cache = null; requestRender();
  }).catch(() => {});
}
try {
  if (navigator.ink && navigator.ink.requestPresenter) {
    navigator.ink.requestPresenter({ presentationArea: live }).then(p => { presenter = p; }).catch(() => {});
  }
} catch {}

// ---------- boot
async function boot() {
  applyPaper(); resize(); updateDock(); updateUndo();
  $('#fingerBtn').setAttribute('aria-pressed', String(prefs.finger));
  const li = loadJSON(LS_INDEX) || {};
  deleted = Array.isArray(li.deleted) ? li.deleted : [];
  boards = (Array.isArray(li.boards) ? li.boards : [])
    .filter(b => b && typeof b.id === 'string' && lsGet(LS_BOARD(b.id)) != null)
    .map(b => ({ id: b.id, name: String(b.name || 'Whiteboard'), created: b.created, updated: b.updated || 0, n: b.n || 0, where: 'local', cached: true }));
  if (boards.length) {
    const cur = boards.find(b => b.id === li.current) || mostRecent();
    setBoard(cur, readLocal(cur.id) || []);
  } else setSave('loading');
  const fallback = setTimeout(() => { if (!board) { openWelcome(); setSave('local'); } }, 2500);
  const ok = await connect();
  clearTimeout(fallback);
  if (ok) await syncRemote();
  if (!board) openWelcome();
  if (!db) setSave('local');
}
boot();
})();
</script>
